<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Browse Jobs - Job Portal</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="page">
  <nav class="navbar" id="navbar"></nav>
  <div class="container">
    <h1>Browse Jobs</h1>

    <div class="card">
      <form id="filterForm" novalidate>
        <div class="filter-bar">
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_title">Title</label>
            <input type="text" id="f_title" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_location">Location</label>
            <input type="text" id="f_location" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_skill">Skill</label>
            <input type="text" id="f_skill" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_emp_type">Employment Type</label>
            <input type="text" id="f_emp_type" placeholder="exact enum value" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_min_exp">Min. Experience</label>
            <input type="number" id="f_min_exp" min="0" />
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label for="f_salary">Salary</label>
            <input type="number" id="f_salary" min="0" />
          </div>
        </div>
        <div class="btn-row" style="margin-top:1rem;">
          <button type="submit" class="btn btn-primary">Search</button>
          <button type="button" id="clearFiltersBtn" class="btn btn-secondary">Clear Filters</button>
        </div>
      </form>
    </div>

    <div id="jobsAlert"></div>
    <div id="jobList" class="spacer"></div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/jobs.js"></script>
<script>
  requireAuth("Candidate");
  renderNavbar("jobs");
  initBrowseJobsPage();
</script>
</body>
</html>
