<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Company Profile - Job Portal</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="page">
  <nav class="navbar" id="navbar"></nav>
  <div class="container">
    <h1 id="profileHeading">Company Profile</h1>
    <div class="card" style="max-width:640px;">
      <div id="profileAlert"></div>
      <form id="profileForm" novalidate>
        <div class="form-group">
          <label for="companyName">Company Name</label>
          <input type="text" id="companyName" required />
        </div>
        <div class="form-group">
          <label for="companyDescription">Company Description</label>
          <textarea id="companyDescription" required></textarea>
        </div>
        <div class="form-group">
          <label for="companyLocation">Company Location</label>
          <input type="text" id="companyLocation" required />
        </div>
        <button type="submit" id="profileSubmitBtn" class="btn btn-primary">Save</button>
      </form>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/recruiter.js"></script>
<script>
  requireAuth("Recruiter");
  renderNavbar("profile");
  initRecruiterProfilePage();
</script>
</body>
</html>
