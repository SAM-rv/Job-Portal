<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Log In - Job Portal</title>
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="page">
  <div class="container-narrow">
    <h1 class="center">Job Portal</h1>
    <p class="center">Log in to your account</p>

    <div class="card">
      <div id="loginAlert"></div>
      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" required />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" required />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Log In</button>
      </form>
    </div>

    <p class="center muted">Don't have an account? <a href="register.html">Register</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script src="../js/auth.js"></script>
<script>initLoginPage();</script>
</body>
</html>
